<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Runner 84</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0d0221;
            color: #00f6ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 900px;
            overflow: hidden;
            box-shadow: 0 0 20px #ff007f;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 8px #00f6ff, 0 0 12px #ff007f;
        }

        /* On-Screen Touch Controls */
        #touch-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            width: 100%;
            height: 160px;
            pointer-events: auto;
            margin-bottom: 10px;
        }

        .t-btn {
            background: rgba(255, 0, 127, 0.2);
            border: 2px solid #00f6ff;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            text-shadow: 0 0 5px #00f6ff;
            box-shadow: inset 0 0 10px rgba(0, 246, 255, 0.3);
        }

        .t-btn:active {
            background: rgba(0, 246, 255, 0.4);
            border-color: #ff007f;
            transform: scale(0.95);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 33, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            z-index: 30;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff007f;
            text-shadow: 3px 3px 0px #00f6ff, 0 0 15px #ff007f;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1rem;
            text-shadow: 0 0 5px #00f6ff;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: 2px solid #00f6ff;
            color: #fff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007f;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px #00f6ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div class="crt-overlay"></div>
        
        <div id="ui-layer">
            <div class="hud">
                <div>SCORE: <span id="score">0</span></div>
                <div>HIGH: <span id="highscore">0</span></div>
            </div>

            <!-- Arcade Touch Control Grid -->
            <div id="touch-controls">
                <div style="grid-column: 2;" class="t-btn" id="btn-jump">▲ JUMP</div>
                <div style="grid-column: 1; grid-row: 2;" class="t-btn" id="btn-left">◀ LEFT</div>
                <div style="grid-column: 2; grid-row: 2;" class="t-btn" id="btn-slide">▼ SLIDE</div>
                <div style="grid-column: 3; grid-row: 2;" class="t-btn" id="btn-right">RIGHT ▶</div>
            </div>
        </div>

        <div id="start-screen" class="screen">
            <h1>CYBER RUN 84</h1>
            <p>Use Buttons or Swipe<br>Jump over Cyan hurdles | Slide under Orange barriers!</p>
            <button id="start-btn" class="btn">INSERT COIN</button>
        </div>

        <div id="gameover-screen" class="screen hidden">
            <h1 style="color: #ff0055;">SYSTEM CRASH</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playJump() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playCrash() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sfx = new SoundFX();

        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let scene, camera, renderer, player;
        let obstacles = [];
        let gameActive = false;
        let score = 0;
        let highscore = localStorage.getItem('cyber_runner_hi') || 0;
        highscoreEl.innerText = highscore;

        const LANES = [-1.8, 0, 1.8];
        let currentLane = 1;
        let isJumping = false;
        let isRolling = false;
        let jumpVelocity = 0;
        let speed = 0.35;
        let spawnTimer = 0;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0221);
            scene.fog = new THREE.FogExp2(0x0d0221, 0.025);

            camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 3.2, 6.5);
            camera.lookAt(0, 1, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff007f, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Synthwave Grid Floor
            const gridGeo = new THREE.PlaneGeometry(20, 100, 20, 50);
            const gridMat = new THREE.MeshBasicMaterial({ color: 0x00f6ff, wireframe: true });
            const floor = new THREE.Mesh(gridGeo, gridMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -40;
            scene.add(floor);

            // Player Setup
            const pGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            bodyGeo.computeBoundingSphere();
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0x550022 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            pGroup.add(body);

            const visorGeo = new THREE.BoxGeometry(0.7, 0.3, 0.2);
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f6ff });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 0.9, 0.35);
            pGroup.add(visor);

            player = pGroup;
            player.frustumCulled = false;
            player.position.set(0, 0, 0);
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random();

            let obsGeo, obsMat, yPos, height;

            if (type < 0.45) {
                // Low barrier (Jump over): Low profile
                height = 0.5; yPos = 0.25;
                obsMat = new THREE.MeshPhongMaterial({ color: 0x00f6ff, emissive: 0x004455 });
            } else if (type < 0.75) {
                // High block (Slide under): Raised up high
                height = 1.0; yPos = 1.6;
                obsMat = new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: 0x442200 });
            } else {
                // Tall barrier (Must dodge)
                height = 2.2; yPos = 1.1;
                obsMat = new THREE.MeshPhongMaterial({ color: 0xff0055, emissive: 0x550011 });
            }

            obsGeo = new THREE.BoxGeometry(1.4, height, 0.8);
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(LANES[lane], yPos, -45);
            obs.userData = { type: type < 0.45 ? 'low' : type < 0.75 ? 'high' : 'tall', lane: lane };

            scene.add(obs);
            obstacles.push(obs);
        }

        function moveLeft() { if (gameActive && currentLane > 0) currentLane--; }
        function moveRight() { if (gameActive && currentLane < 2) currentLane++; }
        function doJump() {
            if (gameActive && !isJumping) {
                isJumping = true;
                jumpVelocity = 0.34; // Stronger jump force to clear low barriers easily
                sfx.playJump();
            }
        }
        function doSlide() {
            if (gameActive && !isRolling) {
                isRolling = true;
                setTimeout(() => { isRolling = false; }, 650); // Longer slide duration
            }
        }

        function resetGame() {
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            currentLane = 1;
            player.position.set(0, 0, 0);
            score = 0;
            speed = 0.35;
            scoreEl.innerText = '0';
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            sfx.playCrash();
            finalScoreEl.innerText = Math.floor(score);
            if (Math.floor(score) > highscore) {
                highscore = Math.floor(score);
                localStorage.setItem('cyber_runner_hi', highscore);
                highscoreEl.innerText = highscore;
            }
            gameoverScreen.classList.remove('hidden');
        }

        function update() {
            if (!gameActive) return;

            // Smooth Lane Movement
            let targetX = LANES[currentLane];
            player.position.x += (targetX - player.position.x) * 0.25;

            camera.position.x = player.position.x * 0.3;

            // Jump Dynamics
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.02; // Slightly lower gravity for better float
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            // Slide Dynamics (Flattens player height to crouch)
            if (isRolling) {
                player.scale.y = 0.3;
                player.position.y = 0.18;
            } else if (!isJumping) {
                player.scale.y = 1.0;
                player.position.y = 0;
            }

            // Obstacle Spawning
            spawnTimer++;
            if (spawnTimer > Math.max(25, 55 - Math.floor(speed * 20))) {
                spawnObstacle();
                spawnTimer = 0;
            }

            speed += 0.00008;
            score += speed * 0.5;
            scoreEl.innerText = Math.floor(score);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Precision Hitbox Check
                if (Math.abs(obs.position.z - player.position.z) < 0.5) {
                    if (obs.userData.lane === currentLane) {
                        let hit = false;
                        
                        // Low Hurdle: Requires player jump height > 0.45
                        if (obs.userData.type === 'low' && player.position.y <= 0.45) hit = true;
                        
                        // High Barrier: Requires player to be sliding (isRolling)
                        if (obs.userData.type === 'high' && !isRolling) hit = true;
                        
                        // Tall Wall: Cannot be jumped over or slid under
                        if (obs.userData.type === 'tall') hit = true;

                        if (hit) {
                            gameOver();
                            return;
                        }
                    }
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // Touch Control Bindings
        document.getElementById('btn-left').addEventListener('pointerdown', moveLeft);
        document.getElementById('btn-right').addEventListener('pointerdown', moveRight);
        document.getElementById('btn-jump').addEventListener('pointerdown', doJump);
        document.getElementById('btn-slide').addEventListener('pointerdown', doSlide);

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w') doJump();
            if (e.key === 'ArrowDown' || e.key === 's') doSlide();
        });

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        startBtn.addEventListener('click', () => {
            sfx.init();
            startScreen.classList.add('hidden');
            resetGame();
        });

        restartBtn.addEventListener('click', () => {
            gameoverScreen.classList.add('hidden');
            resetGame();
        });

        initThree();
        animate();
    </script>
</body>
</html>
