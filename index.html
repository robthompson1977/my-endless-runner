<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Runner 84</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0d0221;
            color: #00f6ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 900px;
            overflow: hidden;
            box-shadow: 0 0 20px #ff007f;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 8px #00f6ff, 0 0 12px #ff007f;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 33, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 2.5rem;
            color: #ff007f;
            text-shadow: 3px 3px 0px #00f6ff, 0 0 15px #ff007f;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1rem;
            text-shadow: 0 0 5px #00f6ff;
            line-height: 1.4;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: 2px solid #00f6ff;
            color: #fff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007f;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px #00f6ff;
        }

        .hidden {
            display: none !important;
        }

        #controls-hint {
            font-size: 0.8rem;
            color: #00f6ff;
            opacity: 0.8;
            margin-top: 15px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div class="crt-overlay"></div>
        
        <div id="ui-layer">
            <div class="hud">
                <div>SCORE: <span id="score">0</span></div>
                <div>HIGH: <span id="highscore">0</span></div>
            </div>
        </div>

        <div id="start-screen" class="screen">
            <h1>CYBER RUN 84</h1>
            <p>SWIPE Left/Right to Dodge<br>SWIPE Up to Jump | Down to Roll</p>
            <button id="start-btn" class="btn">INSERT COIN</button>
            <div id="controls-hint">Desktop: Arrow Keys / WASD</div>
        </div>

        <div id="gameover-screen" class="screen hidden">
            <h1 style="color: #ff0055;">SYSTEM CRASH</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        // Audio Synthesizer (No external sound files required)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playCrash() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sfx = new SoundFX();

        // Game Setup
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let scene, camera, renderer;
        let player, playerGrid;
        let obstacles = [];
        let gridLines = [];
        let gameActive = false;
        let score = 0;
        let highscore = localStorage.getItem('cyber_runner_hi') || 0;
        highscoreEl.innerText = highscore;

        // Player Motion States
        const LANES = [-2.2, 0, 2.2];
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let targetX = 0;
        let isJumping = false;
        let isRolling = false;
        let jumpVelocity = 0;
        let playerY = 0.5;
        let speed = 0.4;
        let spawnTimer = 0;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0221);
            scene.fog = new THREE.FogExp2(0x0d0221, 0.03);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Ambient & Neon Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff007f, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Synthwave Grid Floor
            const gridGeo = new THREE.PlaneGeometry(30, 100, 30, 50);
            const gridMat = new THREE.MeshBasicMaterial({ color: 0x00f6ff, wireframe: true });
            const floor = new THREE.Mesh(gridGeo, gridMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -40;
            scene.add(floor);

            // Player Setup (Neon Blocky Runner)
            const pGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0x550022 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            pGroup.add(body);

            // Visor
            const visorGeo = new THREE.BoxGeometry(0.7, 0.3, 0.2);
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f6ff });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 0.9, 0.35);
            pGroup.add(visor);

            player = pGroup;
            player.position.set(0, 0, 0);
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random(); // 0-0.5: Low hurdle, 0.5-0.8: High block, 0.8-1.0: Full Wall

            let obsGeo, obsMat, yPos, height;

            if (type < 0.5) {
                // Low barrier (Jump over)
                height = 0.6;
                yPos = 0.3;
                obsMat = new THREE.MeshPhongMaterial({ color: 0x00f6ff, emissive: 0x004455 });
            } else if (type < 0.8) {
                // High block (Duck under or dodge)
                height = 1.2;
                yPos = 1.4;
                obsMat = new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: 0x442200 });
            } else {
                // Tall barrier (Must dodge)
                height = 2.2;
                yPos = 1.1;
                obsMat = new THREE.MeshPhongMaterial({ color: 0xff0055, emissive: 0x550011 });
            }

            obsGeo = new THREE.BoxGeometry(1.5, height, 1);
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(LANES[lane], yPos, -50);
            obs.userData = { type: type < 0.5 ? 'low' : type < 0.8 ? 'high' : 'tall', height: height, lane: lane };

            scene.add(obs);
            obstacles.push(obs);
        }

        function resetGame() {
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            currentLane = 1;
            targetX = 0;
            player.position.set(0, 0, 0);
            score = 0;
            speed = 0.45;
            scoreEl.innerText = '0';
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            sfx.playCrash();
            finalScoreEl.innerText = Math.floor(score);
            if (Math.floor(score) > highscore) {
                highscore = Math.floor(score);
                localStorage.setItem('cyber_runner_hi', highscore);
                highscoreEl.innerText = highscore;
            }
            gameoverScreen.classList.remove('hidden');
        }

        function update() {
            if (!gameActive) return;

            // Lane Transition Smoothness
            targetX = LANES[currentLane];
            player.position.x += (targetX - player.position.x) * 0.2;

            // Jump Dynamics
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.025; // Gravity
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            // Roll Dynamics
            if (isRolling) {
                player.scale.y = 0.5;
            } else {
                player.scale.y = 1.0;
            }

            // Move & Spawn Obstacles
            spawnTimer++;
            if (spawnTimer > Math.max(20, 60 - Math.floor(speed * 20))) {
                spawnObstacle();
                spawnTimer = 0;
            }

            speed += 0.0001; // Gradual Speed Increase
            score += speed * 0.5;
            scoreEl.innerText = Math.floor(score);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Collision Detection
                if (Math.abs(obs.position.z - player.position.z) < 0.8) {
                    if (obs.userData.lane === currentLane) {
                        let hit = false;
                        if (obs.userData.type === 'low' && player.position.y < 0.5) hit = true;
                        if (obs.userData.type === 'high' && !isRolling) hit = true;
                        if (obs.userData.type === 'tall') hit = true;

                        if (hit) {
                            gameOver();
                            return;
                        }
                    }
                }

                // Cleanup Off-Screen
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // Swipe Controls Logic
        let touchStartX = 0;
        let touchStartY = 0;

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        container.addEventListener('touchend', e => {
            if (!gameActive) return;
            let diffX = e.changedTouches[0].screenX - touchStartX;
            let diffY = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal Swipe
                if (diffX > 30 && currentLane < 2) currentLane++;
                if (diffX < -30 && currentLane > 0) currentLane--;
            } else {
                // Vertical Swipe
                if (diffY < -30 && !isJumping) {
                    isJumping = true;
                    jumpVelocity = 0.35;
                    sfx.playJump();
                }
                if (diffY > 30 && !isRolling) {
                    isRolling = true;
                    setTimeout(() => { isRolling = false; }, 600);
                }
            }
        }, false);

        // Keyboard Controls (Desktop Support)
        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
            if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) {
                isJumping = true;
                jumpVelocity = 0.35;
                sfx.playJump();
            }
            if ((e.key === 'ArrowDown' || e.key === 's') && !isRolling) {
                isRolling = true;
                setTimeout(() => { isRolling = false; }, 600);
            }
        });

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        startBtn.addEventListener('click', () => {
            sfx.init();
            startScreen.classList.add('hidden');
            resetGame();
        });

        restartBtn.addEventListener('click', () => {
            gameoverScreen.classList.add('hidden');
            resetGame();
        });

        initThree();
        animate();
    </script>
</body>
</html>
